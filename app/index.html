<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="./style/root.css" />
  <link rel="stylesheet" href="./style/font.css" />
  <link rel="stylesheet" href="./style/style.css" />
  <title>Connection</title>
</head>

<body>
  <header>
    <div class="side-left">
      <picture class="logo-picutre">
        <img src="./svg/logo_connection_default.svg" alt="logo_connection_default" class="logo-svg" />
      </picture>
    </div>
    <div class="side-right">
      <button onclick="changeTheme()">
        <img src="./svg/icone_switch_theme.svg" alt="icone_switch_theme" class="icone_switch_theme" />
      </button>
    </div>
  </header>
  <main>
    <section class="temporizador-container">
      <div class="temporizador">
        <div class="temporizador-text montserrat-italic">Temporizador</div>
        <div class="temporizador-time montserrat-bold">00:00</div>
      </div>
      <div class="temporizador-controls">
        <button class="temporizador-button" id="switchButtonTemporizador"><span class="material-symbols-outlined">
            play_arrow
          </span></button>
        <button class="temporizador-button" id="resetButtonTemporizador"><span class="material-symbols-outlined">
            forward_media
          </span></button>
        <button class="temporizador-button" id="alertButtonTemporizador"><span class="material-symbols-outlined">
            notifications
          </span></button>
      </div>
      <div class="switch-types-temporizador">
        <button class="switch-type-temporizador active montserrat-bold" id="switchTypeTemporizadorFoco">Foco</button>
        <button class="switch-type-temporizador montserrat-regular" id="switchTypeTemporizadorRelax">Descanço</button>
      </div>
    </section>
    <section class="todo-list-section">
      <h2 class="todo-list-title montserrat-bold">A fazer...</h2>
      <div class="todo-list-input-container">
        <div class="box-task">
          <input type="checkbox" name="check-task" id="check-task" class="check-task" />
          <input class="montserrat-regular" type="text" id="todoInput" placeholder="Adicionar tarefa..."
            aria-label="Adicionar tarefa" />
          <button id="addTodoButton" aria-label="Adicionar tarefa">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
      </div>
      <ul id="todoList"></ul>
    </section>
  </main>
</body>

</html>
